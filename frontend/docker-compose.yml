services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: motochatz-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.docker
    networks:
      - motochatz-network
    restart: unless-stopped

networks:
  motochatz-network:
    driver: bridge
