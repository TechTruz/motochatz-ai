<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Upload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Document Upload System</h1>

        <div id="auth-section">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <input type="password" id="register-repeat-password" placeholder="Repeat Password" required>
                <input type="text" id="register-first-name" placeholder="First Name" required>
                <input type="text" id="register-garage-name" placeholder="Garage Name" required>
                <button type="submit">Register</button>
            </form>

            <h2>Login</h2>
            <form id="login-form">
                <input type="text" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p id="auth-message"></p>
        </div>

        <div id="upload-section" style="display: none;">
            <h2>Upload Document</h2>
            <input type="file" id="file-input">
            <button id="upload-button">Upload</button>
            <p id="upload-message"></p>
            <button id="logout-button">Logout</button>
        </div>

        <div id="documents-section" style="display: none;">
            <h2>Your Documents</h2>
            <p id="documents-message"></p>
            <ul id="documents-list">
                <!-- Documents will be listed here -->
            </ul>
        </div>

        <div id="chats-section" style="display: none;">
            <h2>Chat Sessions</h2>
            <button id="create-chat-button">Start New Chat</button>
            <p id="chats-message"></p>
            <ul id="chats-list">
                <!-- Chats will be listed here -->
            </ul>
        </div>

        <div id="chat-window-section" style="display: none;">
            <h2 id="chat-title">Chat</h2>
            <div id="messages-container">
                <div id="messages-list"></div>
            </div>
            <div id="chat-status-container">
                Status: <span id="chat-status-display">Idle</span>
            </div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Type your message..." required>
                <button type="submit" id="send-message-button">Send</button>
            </form>
            <button id="back-to-chats-button">Back to Chats</button>
        </div>

        <div id="ingest-stream-section" style="display: none;">
            <h2>Stream Ingest Test</h2>
            <div>
                <label for="ingest-document-id">Document ID (e.g., from an uploaded doc):</label>
                <input type="text" id="ingest-document-id" placeholder="Enter document ID">
                <button id="start-ingest-button">Start Ingest Stream</button>
                <button id="stop-ingest-button" disabled>Stop Ingest Stream</button>
            </div>
            <h3>Current Status: <span id="ingest-status-display">Idle</span></h3>
            <h3>Raw Events:</h3>
            <pre id="ingest-events"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
